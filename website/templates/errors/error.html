{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block content %}
<section class="text-center py-5" aria-labelledby="error-heading">
    <p class="display-4 text-secondary mb-2">{{ code }}</p>
    <h1 class="h3" id="error-heading">{{ title }}</h1>
    <p class="text-secondary">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.landing') }}">Volver al inicio</a>
</section>
{% endblock %}
