{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 app-toasts">
    {% for category, message in messages %}
    <div class="toast align-items-center border-0 text-bg-{{ 'danger' if category in ('error', 'danger') else 'success' if category == 'success' else 'primary' }}"
         role="alert" aria-live="assertive" aria-atomic="true" data-app-toast>
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
